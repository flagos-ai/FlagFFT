name: Correctness Test

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch or commit to test"
        required: false
        default: "main"
      combination:
        description: "Combination(s) from conf/test_matrix.yaml, or full for all"
        required: false
        default: "full"
        type: choice
        options:
          - full
          - 1d_ct_single
          - 1d_ct_batch
          - 1d_bs_single
          - 1d_bs_batch
          - 2d_ct
          - 2d_bs
          - 3d
      gpus:
        description: "Comma-separated GPU IDs or 'all'"
        required: false
        default: "0"
      accuracy_only:
        description: "Run only accuracy tests"
        required: false
        default: false
        type: boolean
      performance_only:
        description: "Run only performance tests"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  test:
    runs-on: [flagfft-nvidia-0]
    timeout-minutes: 120

    steps:
      - name: check env
        run: |
          nvidia-smi
          lscpu
          cat /etc/os-release
          nvcc --version
          gcc --version
          python --version
          pip list
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.branch || github.ref }}
          fetch-depth: 1

      - name: Initialize submodules
        run: |
          git submodule update --init --recursive

      - name: Install Python dependencies
        run: |
          pip install --no-warn-conflicts nanobind ninja cmake pybind11 pytest pyyaml
          pip install --no-warn-conflicts -U pip "setuptools<82" wheel scikit-build-core

      - name: Install project
        run: |
          pip install -e .

      - name: Build project
        run: |
          cmake -S . -B build -GNinja \
            -DBACKEND=CUDA \
            -DFLAGFFT_BUILD_TESTS=ON \
            -DFLAGFFT_BUILD_CLI=ON
          cmake --build build

      - name: Run unified tests
        run: |
          python tools/run_tests.py \
            --combination ${{ inputs.combination || 'full' }} \
            --gpus ${{ inputs.gpus || '0' }} \
            ${{ inputs.accuracy_only == true && '--accuracy-only' || '' }} \
            ${{ inputs.performance_only == true && '--performance-only' || '' }} \
            --output-dir results \
            -v

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: |
            results/
            build/ctest/Testing/
