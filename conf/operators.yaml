# The acceptance surface has 30 logical operators. Every operator expands to
# torch.float32 and torch.float64 cases; the runner maps these to the matching
# FlagFFT C2C/R2C/C2R or Z2Z/D2Z/Z2D API.
ops:
  - id: 1d_ct_single_c2c
    description: Single 1D complex-to-complex FFT on the Cooley-Tukey size set.
    for: [flagfftExecC2C, flagfftExecZ2Z]
    labels: [fft, 1d, single, ct]
    kind: [Math]
    stages:
      - stable: "0.1.0"
    api: c2c
    rank: 1
    algorithm: ct
    batch: single
    sizes: sizes_1d_ct
    dtypes: [torch.float32, torch.float64]
