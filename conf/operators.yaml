# FlagFFT 算子定义

# 固定 36 个验收算子，顺序与验收清单一致。
# api 同时用于 FlagFFT、平台库和 NumPy；方向由 api 推导。
# 1D algorithm: ct / prime，batch: single / batch；实际批次数在 test_matrix.yaml。
# 2D/3D 不细分算法或 batch 类别；sizes 引用 test_matrix.yaml 中的尺寸集合。

ops:
  - id: 1d_ct_single_c2c
    api: c2c
    rank: 1
    algorithm: ct
    batch: single
    sizes: sizes_1d_ct

  - id: 1d_ct_single_c2r
    api: c2r
    rank: 1
    algorithm: ct
    batch: single
    sizes: sizes_1d_ct

