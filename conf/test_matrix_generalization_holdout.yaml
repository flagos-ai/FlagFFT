# Fixed holdout: do not tune policy thresholds against these measurements.
# Freeze this list before tuning; if used to tune, retire it as a holdout and
# create a new independently chosen list. This is a shape holdout, not a
# guarantee of unseen factor families or unseen sub-kernel implementations.
profile: generalization
split: holdout

sizes_1d_ct:
  - 80
  - 384
  - 1280
  - 2304
  - 3584

sizes_1d_fourstep:
  - 6144
  - 18432
  - 98304

sizes_1d_prime:
  - 263
  - 1061
  - 4099
  - 32771

# Includes held-out transposes of discovery rectangles to check axis sensitivity.
sizes_2d:
  - [65, 63]
  - [160, 96]
  - [128, 255]
  - [128, 257]
  - [224, 288]

sizes_3d:
  - [19, 15, 17]
  - [40, 48, 24]
  - [63, 64, 65]
  - [65, 64, 64]
  - [40, 384, 24]

batches:
  single: [1]
  batch: [2, 8, 63]
  2d: [1]
  2d_batch: [2, 5]
  3d: [1]
  3d_batch: [2, 5]

scales: [1.0]
