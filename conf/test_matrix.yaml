# FlagFFT 测例参数矩阵
# 定义尺寸、批大小、缩放等参数空间
# 与 operators.yaml 配合使用，展开为具体测例

# ── 1D 尺寸定义 ────────────────────────────────────────────────

# Cooley-Tukey 平滑数（可被 {2..19} 的因数分解）
sizes_ct:
  - 16
  - 256
  - 2048
  - 16384
  - 46189     # 11 * 13 * 17 * 19
  - 49152      # 3 * 2^14
  - 59049      # 3^10
  - 65536      # 2^16
  - 69360      # 2^4 * 3 * 5 * 17^2
  - 73728      # 3^2 * 2^13
  - 106590     # 2 * 3 * 5 * 11 * 17 * 19
  - 107520     # 2^10 * 3 * 5 * 7
  - 117649     # 7^6
  - 147968     # 2^9 * 17^2
  - 163840     # 5 * 2^15
  - 185640     # 2^3 * 3 * 5 * 7 * 13 * 17
  - 262144     # 2^18
  - 328050     # 2 * 3^8 * 5^2
  - 340200     # 2^3 * 3^5 * 5^2 * 7
  - 390625     # 5^8
  - 477360     # 2^4 * 3 * 5 * 13 * 17 * 19
  - 522240     # 2^11 * 3 * 5 * 17
  - 545292     # 2^2 * 3^3 * 7^3 * 11
  - 589824     # 3^2 * 2^16
  - 654885     # 3^5 * 5 * 7^2 * 11
  - 655360     # 5 * 2^17
  - 663000     # 2^3 * 3 * 5^3 * 13 * 17
  - 707616     # 2^5 * 3^2 * 7 * 13 * 17
  - 710775     # 3^4 * 5^2 * 13 * 17
  - 786432     # 3 * 2^18
  - 819200     # 5^2 * 2^15
  - 855712     # 2^5 * 11^2 * 13 * 17
  - 884736     # 3^3 * 2^15
  - 917504     # 7 * 2^17
  - 961875     # 3^4 * 5^4 * 19
  - 983040     # 3 * 5 * 2^16
  - 1001385    # 3^2 * 5 * 7 * 11 * 17^2
  - 1048576    # 2^20

# Bluestein/Rader 素数和复合数
# 小素数走 Rader（n-1 可分解），>16384 的素数走 Bluestein
sizes_bs:
  - 23        # DirectDFT
  - 67        # Rader
  - 997       # Bluestein（996 不可分解）
  - 1009      # Rader
  - 8191      # Rader（Mersenne，8190=2*3^2*5*7*13）
  - 16381     # Rader 上限边界（16380=2^2*3^2*5*7*13）
  - 65537     # 大规模素数（Fermat），Bluestein conv=2^18
  - 104729    # 大规模素数，Bluestein conv=2^18
  - 524287    # 大规模素数（Mersenne），Bluestein conv=2^20
  - 999983    # 超大素数，Bluestein conv>1M 走光滑窗口

# ── 批大小 ─────────────────────────────────────────────────────

batches:
  - 1
  - 256

# ── 输入缩放因子 ───────────────────────────────────────────────

scales:
  - 1.0

# ── 组合规则 ───────────────────────────────────────────────────
# 每个规则定义该算法下使用的参数空间
# sizes/batches/scales 引用上面定义的键名

combinations:
  # Cooley-Tukey 快速冒烟
  ct:
    sizes: sizes_ct
    batches: [1]
    scales: [1.0]

  # Bluestein/Rader 快速冒烟
  bs:
    sizes: sizes_bs
    batches: [1]
    scales: [1.0]

  # 完整测试（CT 尺寸，所有批大小和缩放）
  full:
    sizes: sizes_ct
    batches: batches
    scales: scales

  # 2^20 TLE 优化专项测试
  2p20:
    sizes: [1048576]
    batches: [1]
    scales: [1.0]

  # 2D 测试
  2d:
    sizes:
      - [16, 16]
      - [64, 64]
      - [128, 256]
      - [256, 128]
      - [256, 256]
      - [512, 512]
      - [23, 23]
      - [997, 16]
      - [16, 997]
    batches: [1, 4]
    scales: [1.0]

  # 2D 完整测试
  2d_full:
    sizes:
      - [16, 16]
      - [64, 64]
      - [128, 256]
      - [256, 128]
      - [256, 256]
      - [512, 512]
      - [23, 23]
      - [997, 16]
      - [16, 997]
    batches: batches
    scales: scales

  # 3D 测试
  3d:
    sizes:
      - [16, 16, 16]
      - [32, 16, 8]
      - [8, 32, 16]
      - [16, 32, 64]
      - [64, 32, 16]
      - [128, 64, 32]
      - [23, 16, 16]
      - [16, 997, 8]
      - [16, 16, 997]
    batches: [1]
    scales: [1.0]

  # 3D 完整测试
  3d_full:
    sizes:
      - [16, 16, 16]
      - [32, 16, 8]
      - [8, 32, 16]
      - [16, 32, 64]
      - [64, 32, 16]
      - [128, 64, 32]
      - [23, 16, 16]
      - [16, 997, 8]
      - [16, 16, 997]
    batches: [1]
    scales: scales
